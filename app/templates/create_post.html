{% extends "base.html" %}

{% block title %}发布帖子 - {{ circle.name }}{% endblock %}

{% block content %}
<section class="section narrow-page">
  <p class="eyebrow">New Post</p>
  <h1>发布帖子</h1>
  <p class="circle-description">发布到 {{ circle.name }}</p>

  <div class="form-card">
    <form method="POST" action="" enctype="multipart/form-data">
      <div style="margin-bottom: 20px;">
        <label class="form-label" for="title">帖子标题</label>
        <input
          class="form-input"
          type="text"
          id="title"
          name="title"
          required
          maxlength="100"
          placeholder="请输入帖子标题"
        >
      </div>

      <div style="margin-bottom: 20px;">
        <label class="form-label" for="content">帖子内容</label>
        <textarea
          class="form-input"
          id="content"
          name="content"
          required
          rows="8"
          placeholder="分享你的经验、提出问题或发起约伴..."
        ></textarea>
      </div>

      <div style="margin-bottom: 24px;">
        <label class="form-label" for="images">帖子图片</label>
        <div class="file-upload-control">
          <input
            class="circle-file-input"
            type="file"
            id="images"
            name="images"
            accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif"
            multiple
            data-file-count-target="post-image-count"
          >
          <label class="file-upload-button" for="images">选择图片</label>
          <span class="file-upload-count" id="post-image-count">未选择图片</span>
        </div>
        <p class="form-hint">可上传多张 jpg、jpeg、png、webp、gif 图片。</p>
      </div>

      <button class="button" type="submit">发布帖子</button>
      <a class="button button-secondary" href="{{ url_for('circle.circle_detail', circle_id=circle.id) }}">返回圈子</a>
    </form>
  </div>
</section>
{% endblock %}
