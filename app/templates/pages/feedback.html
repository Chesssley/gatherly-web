{% extends "base.html" %}

{% block title %}问题反馈 - Gatherly{% endblock %}

{% block content %}
<section class="section page-container">
  <div class="container">
    <header class="page-heading">
      <p class="eyebrow">Feedback</p>
      <h1>问题反馈</h1>
      <p>这是课程项目演示版反馈表单。当前不会写入数据库，提交成功后团队会在后续迭代中统一查看。</p>
    </header>

    <form class="info-card feedback-form" method="post" action="{{ url_for('pages.feedback') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="feedback_type">反馈类型</label>
        <select class="form-input" id="feedback_type" name="feedback_type" required>
          {% set selected_type = request.form.get('feedback_type', '功能问题') %}
          {% for option in ['功能问题', '页面显示问题', '活动/报名问题', '同好圈/帖子问题', '私信/通知问题', '其他建议'] %}
            <option value="{{ option }}" {% if selected_type == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="contact">联系方式 <span>可选</span></label>
        <input class="form-input" id="contact" name="contact" type="text" maxlength="160" value="{{ request.form.get('contact', '') }}" placeholder="邮箱、GitHub 账号或其他可联系信息">
      </div>

      <div class="form-group">
        <label class="form-label" for="content">反馈内容</label>
        <textarea class="form-input" id="content" name="content" rows="7" minlength="10" maxlength="1000" required placeholder="请描述你遇到的问题、相关页面、复现步骤或改进建议。">{{ request.form.get('content', '') }}</textarea>
        <p class="form-help">建议 10 到 1000 个字。请不要提交身份证、银行卡、验证码等敏感个人信息。</p>
      </div>

      <button class="button feedback-submit" type="submit">提交反馈</button>
    </form>
  </div>
</section>
{% endblock %}
