{% extends "base.html" %}

{% block title %}同好圈 - Gatherly{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="section-heading">
            <p class="eyebrow">Circles</p>
            <h2>同好圈</h2>
        </div>

        {% if circles %}
        <div class="card-grid">
            {% for circle in circles %}
            <div class="circle-card">
                <div class="card-body">
                    <h3 class="circle-name">{{ circle.name }}</h3>
                    <p class="circle-desc">{{ circle.description or '暂无简介' }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-state">
            <p>暂无同好圈，敬请期待！</p>
        </div>
        {% endif %}
    </div>
</section>
{% endblock %}
