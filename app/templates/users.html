{% extends "base.html" %}

{% block title %}{{ page_title }} - Gatherly{% endblock %}

{% block content %}
<section class="section users-page">
  <div class="container">
    <div class="directory-heading">
      <div>
        <p class="eyebrow">People</p>
        <h1>搜索用户</h1>
      </div>
      <a class="button button-secondary" href="{{ url_for('profile.my_profile') }}">返回个人主页</a>
    </div>

    <form class="people-search-form" method="get" role="search">
      <label class="sr-only" for="user-search-q">搜索用户名、昵称、城市或简介</label>
      <input id="user-search-q" name="q" type="search" value="{{ query }}" placeholder="搜索用户名、昵称、城市或简介">
      <button class="button" type="submit">搜索</button>
    </form>

    <div class="user-card-list">
      {% for card_user in users %}
        {% include "_user_card.html" %}
      {% else %}
        <p class="rating-empty">暂无匹配用户。</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
