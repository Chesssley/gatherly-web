{% extends "base.html" %}

{% block title %}登录 - Gatherly{% endblock %}

{% block content %}
<section class="section narrow-page">
    <p class="eyebrow">Login</p>
    <h1>用户登录</h1>
    <p class="lead">登录后即可管理你的活动、报名参与、加入同好圈。</p>

    <div class="form-card" style="margin-top: 24px;">
        <form method="POST" action="{{ url_for('auth.login') }}">
            <!-- 邮箱 -->
            <div style="margin-bottom: 16px;">
                <label for="email" class="form-label">邮箱</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="请输入注册邮箱" required>
            </div>

            <!-- 密码 -->
            <div style="margin-bottom: 24px;">
                <label for="password" class="form-label">密码</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="button" style="width: 100%;">登录</button>
        </form>

        <p style="margin-top: 16px; color: var(--color-muted); font-size: 14px; text-align: center;">
            还没有账号？<a href="{{ url_for('auth.register') }}" class="text-link">立即注册</a>
        </p>
    </div>
</section>
{% endblock %}
