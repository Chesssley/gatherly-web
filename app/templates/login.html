{% extends "base.html" %}

{% block title %}登录 - Gatherly{% endblock %}

{% block content %}
<script>
(function () {
    var flashArea = document.querySelector('.flash-messages');
    if (!flashArea) return;

    var msgs = flashArea.querySelectorAll('.flash-msg');
    var toastMsg = null;
    for (var i = 0; i < msgs.length; i++) {
        if (msgs[i].textContent.indexOf('请先登录') !== -1) {
            toastMsg = msgs[i].textContent.trim();
            break;
        }
    }
    if (!toastMsg) return;

    // 隐藏左上角 flash 区域，避免重复
    flashArea.style.display = 'none';

    // 创建居中 toast 弹窗
    var toast = document.createElement('div');
    toast.className = 'toast-popup';
    toast.textContent = toastMsg;
    document.body.appendChild(toast);

    // 2.5 秒后触发淡出
    setTimeout(function () {
        toast.classList.add('toast-fade-out');
        // 0.8 秒后（与 CSS transition 同步）移除 DOM
        setTimeout(function () {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 800);
    }, 2500);
})();
</script>
<section class="section narrow-page">
    <p class="eyebrow">Login</p>
    <h1>用户登录</h1>
    <p class="lead">登录后即可管理你的活动、报名参与、加入同好圈。</p>

    <div class="form-card" style="margin-top: 24px;">
        <form method="POST" action="{{ url_for('auth.login') }}">
            <!-- 账号 ID / 邮箱 -->
            <div style="margin-bottom: 16px;">
                <label for="email" class="form-label">账号 ID / 邮箱</label>
                <input type="text" id="email" name="email" class="form-input" placeholder="请输入登录账号或注册邮箱" required>
            </div>

            <!-- 密码 -->
            <div style="margin-bottom: 24px;">
                <label for="password" class="form-label">密码</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="button" style="width: 100%;">登录</button>
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        </form>

        <p style="margin-top: 16px; color: var(--color-muted); font-size: 14px; text-align: center;">
            还没有账号？<a href="{{ url_for('auth.register') }}" class="text-link">立即注册</a>
        </p>
    </div>
</section>
{% endblock %}
