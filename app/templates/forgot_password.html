{% extends "base.html" %}

{% block title %}重置密码 - Gatherly{% endblock %}

{% block content %}
<section class="section narrow-page">
    <p class="eyebrow">Reset Password</p>
    <h1>重置密码</h1>
    <p class="lead">通过注册邮箱接收验证码，设置新的登录密码。</p>

    <div class="form-card" style="margin-top: 24px;">
        <form method="post" action="{{ url_for('auth.forgot_password') }}">
            {% set email_draft = forgot_password_email_draft or request.form.get('email', '') %}
            <div style="margin-bottom: 16px;">
                <label for="email" class="form-label">注册邮箱</label>
                <input type="email" id="email" name="email" class="form-input" value="{{ email_draft }}" placeholder="请输入注册邮箱" maxlength="120" required>
                <button class="button button-secondary" type="submit" formaction="{{ url_for('auth.send_reset_password_code') }}" formmethod="post" formnovalidate style="width: 100%; margin-top: 8px;">发送验证码</button>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="email_code" class="form-label">邮箱验证码</label>
                <input type="text" id="email_code" name="email_code" class="form-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字验证码" required>
            </div>

            <div style="margin-bottom: 16px;">
                <label for="new_password" class="form-label">新密码</label>
                <input type="password" id="new_password" name="new_password" class="form-input" minlength="6" autocomplete="new-password" placeholder="至少 6 个字符" required>
            </div>

            <div style="margin-bottom: 24px;">
                <label for="confirm_password" class="form-label">确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" minlength="6" autocomplete="new-password" placeholder="再次输入新密码" required>
            </div>

            <button type="submit" class="button" style="width: 100%;">重置密码</button>
        </form>

        <p style="margin-top: 16px; color: var(--color-muted); font-size: 14px; text-align: center;">
            想起密码了？<a href="{{ url_for('auth.login') }}" class="text-link">返回登录</a>
        </p>
    </div>
</section>
{% endblock %}
