<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布活动 - Gatherly Web / 聚场</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container">
      <a class="brand" href="../index.html">Gatherly Web / 聚场</a>
      <ul class="nav-links">
        <li><a href="../index.html">首页</a></li>
        <li><a href="activities.html">活动</a></li>
        <li><a href="circles.html">圈子</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a class="button button-small" href="login.html">登录</a></li>
      </ul>
    </nav>
  </header>

  <main class="section">
    <div class="container narrow-page">
      <div class="page-title">
        <p class="eyebrow">Create</p>
        <h1>发布活动</h1>
        <p>填写基础信息，帮助同好了解活动主题、时间和地点。</p>
      </div>
      <form class="form-card">
        <label for="title">活动名称</label>
        <input id="title" type="text" placeholder="例如：周末街头胶片漫步">

        <label for="category">兴趣分类</label>
        <input id="category" type="text" placeholder="例如：胶片摄影">

        <label for="time">活动时间</label>
        <input id="time" type="text" placeholder="例如：周六 14:00">

        <label for="location">活动地点</label>
        <input id="location" type="text" placeholder="例如：老城书店门口">

        <label for="description">活动介绍</label>
        <textarea id="description" rows="5" placeholder="介绍活动内容、适合人群和注意事项"></textarea>

        <button class="button" type="button">保存草稿</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Gatherly Web / 聚场</p>
      <p>让好活动更容易被看见。</p>
    </div>
  </footer>
</body>
</html>
